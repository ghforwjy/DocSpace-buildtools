services:
  onlyoffice-rabbitmq:
    image: ${REGISTRY}${RABBITMQ_MANAGEMENT_IMAGE_NAME}
    container_name: ${RABBIT_CONTAINER_NAME}
    restart: always
    expose:
      - "5672"
      - "15672"
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER_NAME:-onlyoffice}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-onlyoffice_rabbitmq_2025}
      RABBITMQ_DEFAULT_VHOST: ${RABBIT_VIRTUAL_HOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      retries: 3
      start_period: 20s
      timeout: 10s

volumes:
  rabbitmq_data:

networks:
  default:
    name: ${NETWORK_NAME}
    external: true
