services:
  onlyoffice-postgresql:
    image: postgres:16
    container_name: ${PG_CONTAINER_NAME}
    restart: always
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-onlyoffice}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-onlyoffice_pg_2025}
      POSTGRES_DB: ${PG_DATABASE:-easydocs}
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c wal_level=replica
      -c max_wal_size=1GB
      -c min_wal_size=80MB
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-onlyoffice}"]
      interval: 10s
      retries: 3
      start_period: 30s
      timeout: 5s

volumes:
  pg_data:

networks:
  default:
    name: ${NETWORK_NAME}
    external: true
