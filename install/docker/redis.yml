services:
  onlyoffice-redis:
    image: ${REGISTRY}${REDIS_IMAGE_NAME}
    container_name: ${REDIS_CONTAINER_NAME}
    restart: always
    expose:
      - "6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:-easydocs_redis_2025}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-easydocs_redis_2025}", "ping"]
      interval: 10s
      retries: 3
      start_period: 10s
      timeout: 10s

volumes:
  redis_data:

networks:
  default:
    name: ${NETWORK_NAME}
    external: true
